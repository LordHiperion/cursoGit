<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nacionalidade</title>
    <style>
        body { font: normal 18pt Comic Sans MS}

        input { font: normal 18pt Comic Sans MS;
                width: 100px;
        }
        div#res { margin-top: 20px; }

    </style>
</head>
<body>
    <h1>Nacionalidade</h1>
    Digite seu País <input type="text" name="nacio" id="nacio">
    <input type="button" value="Verificar" onclick="pais()">
     <p>Resultado: <div id="res"></div></p></div>


    <script>
        function pais(){
            var nacio = window.document.getElementById("nacio")
            var res = window.document.getElementById("res")
            var nacio = (nacio.value)
            var pais = 'Brasil'
            if (pais == nacio) {
                res.innerHTML = 'Estrangerio'
            }else{
                res.innerHTML = 'Brasileiro'
            }
        }

    </script>
    
</body>
</html>
